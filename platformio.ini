; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lolin_c3_mini

[env]
lib_deps = 
	lvgl/lvgl@9.3.0
build_flags = 
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_CONF_PATH="\"${PROJECT_DIR}/include/lv_conf.h\""

[esp32]
platform = espressif32@6.9.0
framework = arduino
lib_deps = 
	${env.lib_deps}
	lovyan03/LovyanGFX@1.1.16
	fbiego/ChronosESP32@1.7.0
	fbiego/Timber@1.0.0
	bblanchon/ArduinoJson@7.1.0
build_flags = 
	${env.build_flags}
	!python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/esp32')]))"
	-I lib
	-D LV_TICK_CUSTOM=1
	-D LV_MEM_CUSTOM=0
	-D LV_USE_FS_FATFS=1
build_src_filter = 
    +<*>
    +<../hal/esp32>
    -<apps/> 
    -<faces/> 
    -<games/>

; ESP32-C3 LVGL 1.28 Inch 240x240
[env:lolin_c3_mini]
extends = esp32
board = lolin_c3_mini
board_build.partitions = partitions.csv
lib_deps = ${esp32.lib_deps}
build_flags = 
	${esp32.build_flags}
	-D ESPC3=1
	-D LV_MEM_SIZE=144U*1024U
	-D LV_USE_QRCODE=1
	-D LV_MEM_ADR=0
build_src_filter = ${esp32.build_src_filter}

